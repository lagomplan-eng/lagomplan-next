name: E2E

# Runs the Playwright suite against a PRODUCTION build talking to a throwaway
# LOCAL Supabase spun up in the runner. This (a) catches build-only failures
# like NEXT_PUBLIC inlining that dev never shows, and (b) gives DB-backed specs
# (mobile-view) a real database to seed — the route loads trips server-side, so
# page.route() can't fake them. See docs/qa/MASTER-TEST-PLAN.md + board #74.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Point everything at the LOCAL Supabase. These are the fixed Supabase local-dev
# demo keys — NOT secrets (identical on every machine). The build inlines the
# NEXT_PUBLIC_* values; the server + seedTrip use the service-role key.
env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies migrations → builds the schema)
        run: supabase start

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (+ OS deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build (against local Supabase)
        run: npm run build

      - name: E2E (desktop-chrome) — prod build + local Supabase
        run: npx playwright test --project=desktop-chrome
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: ${{ always() }}
        run: supabase stop || true
